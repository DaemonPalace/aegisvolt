# PR checks (SPEC §11). Job names are the required status checks set by protect-branches.sh --with-checks.
name: pr
on:
  pull_request:
    branches: [dev, test, prod]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.17.1

jobs:
  promotion-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Allowed head → base
        env: { HEAD: "${{ github.head_ref }}", BASE: "${{ github.base_ref }}" }
        run: |
          case "$BASE:$HEAD" in
            dev:feature/*|dev:fix/*|test:dev|prod:test) echo "ok: $HEAD -> $BASE" ;;
            *) echo "::error::$HEAD -> $BASE is not allowed (feature/*|fix/* -> dev, dev -> test, test -> prod)"; exit 1 ;;
          esac

  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: GraphQL schema export matches the committed file
        working-directory: services/gateway
        run: PYTHONPATH=.. python -c "from schema import schema; print(schema.as_str())" | diff - schema.graphql
      - name: docker build (4 images)
        run: for s in gateway reservation billing dispatch; do docker build -q --build-arg SERVICE=$s -f services/Dockerfile services; done
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: next build (static export, no server features)
        working-directory: frontend
        run: npm ci && npm run build && test -f out/index.html && test -f out/saga/index.html
      - uses: hashicorp/setup-terraform@v4
        with: { terraform_version: "${{ env.TF_VERSION }}" }
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false && terraform -chdir=infra validate

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q services prefect/test_audit.py

  integration-tests:
    runs-on: ubuntu-latest
    env: { SAGA_STEP_DELAY_SECONDS: "0" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: docker compose up -d --build --wait
      - run: pytest -q tests/integration
      - if: failure()
        run: docker compose logs --tail=100

  e2e-tests:
    runs-on: ubuntu-latest
    env: { SAGA_STEP_DELAY_SECONDS: "0" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: docker compose up -d --build --wait
      - run: pytest -q tests/e2e
      - if: failure()
        run: docker compose logs --tail=100

  terraform-plan:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write, pull-requests: write }
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::272973566676:role/aegisvolt-gha-plan
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v4
        with: { terraform_version: "${{ env.TF_VERSION }}", terraform_wrapper: false }
      - name: terraform plan against the base branch's workspace
        working-directory: infra
        run: |
          set -o pipefail
          terraform init -input=false
          terraform workspace select ${{ github.base_ref }}
          terraform plan -no-color -input=false -lock-timeout=120s | tee plan.txt
      - name: Post plan as PR comment
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo "### terraform plan — workspace \`${{ github.base_ref }}\`"; echo '```'; tail -c 60000 infra/plan.txt; echo '```'; } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
