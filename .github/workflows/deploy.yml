# Deploy on push to an env branch (SPEC §11). The branch name is the target env (dynamic target detection).
name: deploy
on:
  push:
    branches: [dev, test, prod]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  ENV: ${{ github.ref_name }}
  # test is the canary stage: its canary passes the gate and is then HELD at 20% until someone runs canary.yml.
  CANARY_MODE: ${{ github.ref_name == 'test' && 'hold' || 'rollout' }}
  TF_VERSION: 1.17.1
  AWS_REGION: us-east-1
  DEPLOY_ROLE: arn:aws:iam::272973566676:role/aegisvolt-gha-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write, packages: write }
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      services: ${{ steps.changed.outputs.services }}
      api_url: ${{ steps.apply.outputs.api_url }}
      web_url: ${{ steps.apply.outputs.web_url }}
      web_bucket: ${{ steps.apply.outputs.web_bucket }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v6
        with: { role-to-assume: "${{ env.DEPLOY_ROLE }}", aws-region: "${{ env.AWS_REGION }}" }
      - uses: hashicorp/setup-terraform@v4
        with: { terraform_version: "${{ env.TF_VERSION }}", terraform_wrapper: false }
      - name: terraform apply (workspace = branch)
        id: apply
        working-directory: infra
        run: |
          terraform init -input=false
          terraform workspace select "$ENV"
          terraform apply -auto-approve -input=false -lock-timeout=120s
          { echo "api_url=$(terraform output -raw api_url)"
            echo "web_url=$(terraform output -raw web_url)"
            echo "web_bucket=$(terraform output -raw web_bucket)"; } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}" }
      - run: scripts/build-push.sh ${{ steps.tag.outputs.tag }}
      - name: deploy.sh (the gateway allows the env's web origin)
        env: { CORS_ORIGINS: "${{ steps.apply.outputs.web_url }}" }
        run: scripts/deploy.sh "$ENV" ${{ steps.tag.outputs.tag }}
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Frontend → the env's S3 website (one build; config.json picks the API)
        working-directory: frontend
        env:
          API_URL: ${{ steps.apply.outputs.api_url }}
          BUCKET: ${{ steps.apply.outputs.web_bucket }}
        run: |
          npm ci
          npm run build
          # keep the banner of a canary that is still held (canary.yml removes it on promote/rollback)
          held=$(aws s3 cp "s3://$BUCKET/config.json" - 2>/dev/null | jq -c '.canary // null' || echo null)
          jq -n --arg apiUrl "$API_URL" --arg env "$ENV" --argjson canary "${held:-null}" \
            '{apiUrl: $apiUrl, env: $env} + (if $canary then {canary: $canary} else {} end)' > out/config.json
          aws s3 sync out "s3://$BUCKET" --delete
          aws s3 cp out/config.json "s3://$BUCKET/config.json" --cache-control no-store
      - name: Services whose image changed since the previous push
        id: changed
        env: { BEFORE: "${{ github.event.before }}" }
        run: |
          all='["gateway","reservation","billing","dispatch"]'
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then echo "services=$all" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BEFORE" HEAD -- services ':!services/test_unit.py')
          if grep -qE '^services/(common/|Dockerfile|requirements.txt)' <<<"$files"; then svcs=$all
          else svcs=$(grep -oE '^services/(gateway|reservation|billing|dispatch)/' <<<"$files" | cut -d/ -f2 | sort -u | jq -Rnc '[inputs]'); fi
          echo "services=${svcs:-[]}" >> "$GITHUB_OUTPUT"
          echo "changed: ${svcs:-none}"

  canary:
    needs: deploy
    if: needs.deploy.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    strategy:
      fail-fast: false
      # ponytail: canaries run in parallel and CanaryErrors has no service dimension, so one bad canary blocks all; add a dimension if that bites.
      matrix: { service: "${{ fromJSON(needs.deploy.outputs.services) }}" }
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with: { role-to-assume: "${{ env.DEPLOY_ROLE }}", aws-region: "${{ env.AWS_REGION }}" }
      - run: scripts/canary.sh "$ENV" ${{ matrix.service }} ${{ needs.deploy.outputs.tag }} "$CANARY_MODE"
      - name: Canary banner in the env's config.json (the UI shows it above the services list)
        if: env.CANARY_MODE == 'hold'
        env:
          BUCKET: ${{ needs.deploy.outputs.web_bucket }}
          SERVICES: ${{ needs.deploy.outputs.services }}
          TAG: ${{ needs.deploy.outputs.tag }}
        run: |
          aws s3 cp "s3://$BUCKET/config.json" - \
            | jq --arg tag "$TAG" --arg commit "$GITHUB_SHA" --argjson services "$SERVICES" \
                 '.canary = {tag: $tag, commit: $commit, services: $services, since: (now | todate)}' \
            | aws s3 cp - "s3://$BUCKET/config.json" --content-type application/json --cache-control no-store

  smoke:
    needs: [deploy, canary]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: GraphQL health through API Gateway
        env: { API_URL: "${{ needs.deploy.outputs.api_url }}" }
        run: |
          out=$(curl -sf -m 20 -X POST "$API_URL" -H 'content-type: application/json' \
            -d '{"query":"{ health { env services { service status version } } }"}')
          echo "$out"
          jq -e --arg env "$ENV" '.data.health.env == $env and ([.data.health.services[].status] | all(. == "ok"))' <<<"$out"
      - name: Web UI serves its env's config
        env: { WEB_URL: "${{ needs.deploy.outputs.web_url }}" }
        run: curl -sf -m 20 "$WEB_URL/config.json" | jq -e --arg env "$ENV" '.env == $env' 
