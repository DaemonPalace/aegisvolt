# Selector is app only, so stable and canary pods share traffic by replica count (4:1 = 20% canary). SPEC §10.
apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: aegisvolt }
spec:
  type: NodePort
  selector: { app: gateway }
  ports: [{ port: 80, targetPort: 8000, nodePort: 30080 }]
---
apiVersion: v1
kind: Service
metadata: { name: reservation, namespace: aegisvolt }
spec:
  selector: { app: reservation }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: v1
kind: Service
metadata: { name: billing, namespace: aegisvolt }
spec:
  selector: { app: billing }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: v1
kind: Service
metadata: { name: dispatch, namespace: aegisvolt }
spec:
  selector: { app: dispatch }
  ports: [{ port: 80, targetPort: 8000 }]
